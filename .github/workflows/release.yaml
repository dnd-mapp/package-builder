name: Release

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
    verify:
        name: Verify
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Run CI checks
              uses: ./.github/actions/ci

            - name: Verify the tag and the changelog
              uses: dnd-mapp/action-verify-release@11f90d23b494b32b4390653b94da25d08d91ef33 # v1.0.0

            - name: Upload the release notes
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: release-notes
                  path: release-notes.md
                  if-no-files-found: error

    publish:
        name: Stage on npm
        needs: verify
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        environment: npm
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js and pnpm and install dependencies
              uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
              with:
                  cache: true
                  runtime: node
                  require-lockfile: true

            - name: Stage the package
              shell: bash
              run: pnpm stage publish --provenance --no-git-checks

    release:
        name: GitHub Release
        needs:
            - verify
            - publish
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: write
            discussions: write
        steps:
            - name: Download the release notes
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: release-notes

            - name: Create the release
              shell: bash
              run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Release $GITHUB_REF_NAME" --notes-file release-notes.md --discussion-category Announcements
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
